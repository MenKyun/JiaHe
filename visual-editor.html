<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e9e5dc">
  <title>首頁編輯器 | TR SELECT</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="visual-editor-page">
  <a class="skip-link" href="#visual-editor-main">跳到內容編輯</a>
  <header class="admin-header visual-editor-header">
    <div>
      <p class="eyebrow">TR Studio / Homepage</p>
      <h1>首頁編輯器</h1>
      <p>調整首頁主圖輪播、文案、內容區塊與品牌色，右側會同步呈現結果。</p>
    </div>
    <nav>
      <a class="secondary-link" href="index.html">查看商店</a>
      <a class="secondary-link" href="admin.html">商品工作台</a>
      <button class="primary-link" id="save-content" type="button">儲存變更</button>
    </nav>
  </header>

  <main class="visual-editor-layout" id="visual-editor-main">
    <section class="visual-editor-panel" aria-labelledby="editor-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Content</p>
          <h2 id="editor-title">編輯內容</h2>
        </div>
      </div>

      <form class="visual-editor-form" id="visual-editor-form">
        <details open>
          <summary>品牌與色系</summary>
          <label>🎨 一鍵套用精選配色方案
            <select id="preset-theme-select">
              <option value="">自訂配色</option>
              <option value="cyberpunk">⚡ 賽博螢光 (Cyberpunk)</option>
              <option value="luxury">✨ 極簡奢華 (Minimal Luxury)</option>
              <option value="emerald">🌲 翡翠深青 (Emerald Slate)</option>
              <option value="obsidian">🌑 曜石暗黑 (Dark Obsidian)</option>
              <option value="warm">📜 復古暖紙 (Warm Paper)</option>
            </select>
          </label>
          <div class="form-grid" style="margin-top: 10px;">
            <label>品牌主色 <input data-field="theme.brand" type="color"></label>
            <label>深色背景 <input data-field="theme.brandDark" type="color"></label>
            <label>重點按鈕 <input data-field="theme.accent" type="color"></label>
            <label>輔助金色 <input data-field="theme.gold" type="color"></label>
          </div>
          <label>Logo 文字 <input data-field="brand.logoMark" type="text" maxlength="3"></label>
          <label>網站名稱 <input data-field="brand.name" type="text"></label>
          <label>英文副標 <input data-field="brand.tagline" type="text"></label>
          <label>搜尋框提示 <input data-field="brand.searchPlaceholder" type="text"></label>
        </details>

        <details>
          <summary>頂部促銷條與工具列</summary>
          <label>促銷標籤 <input data-field="promo.label" type="text"></label>
          <label>促銷文字 <input data-field="promo.text" type="text"></label>
          <div class="form-grid">
            <label>按鈕文字 <input data-field="promo.linkText" type="text"></label>
            <label>按鈕連結 <input data-field="promo.linkUrl" type="text"></label>
          </div>
          <label>APP 提示文字 <input data-field="utility.appText" type="text"></label>
          <div class="form-grid">
            <label>收藏入口 <input data-field="utility.favoriteText" type="text"></label>
            <label>登入入口 <input data-field="utility.loginText" type="text"></label>
          </div>
        </details>

        <details open>
          <summary>首頁主視覺</summary>
          <section class="hero-slide-settings" aria-labelledby="hero-slides-title">
            <div class="section-inline-heading">
              <div>
                <h3 id="hero-slides-title">主圖輪播</h3>
                <p class="editor-help">最多 5 張。可貼圖片網址或直接上傳，第一張會優先載入。</p>
              </div>
              <button class="secondary-link" id="add-hero-slide" type="button">新增主圖</button>
            </div>
            <div class="form-grid hero-playback-settings">
              <label class="checkbox-field">自動輪播
                <input data-field="hero.autoplay" type="checkbox">
              </label>
              <label>切換秒數
                <input data-field="hero.interval" type="number" min="3" max="15" step="1">
              </label>
            </div>
            <div class="hero-slides-editor" id="hero-slides-editor"></div>
          </section>
          <label>小標 <input data-field="hero.eyebrow" type="text"></label>
          <label>主標題 <textarea data-field="hero.title" rows="2"></textarea></label>
          <label>介紹文案 <textarea data-field="hero.copy" rows="4"></textarea></label>
          <div class="form-grid">
            <label>主按鈕文字 <input data-field="hero.primaryText" type="text"></label>
            <label>主按鈕連結 <input data-field="hero.primaryUrl" type="text"></label>
            <label>副按鈕文字 <input data-field="hero.secondaryText" type="text"></label>
            <label>副按鈕連結 <input data-field="hero.secondaryUrl" type="text"></label>
          </div>
          <div class="form-grid">
            <label>主活動標籤 <input data-field="hero.mainDealLabel" type="text"></label>
            <label>主活動標題 <input data-field="hero.mainDealTitle" type="text"></label>
            <label>主活動說明 <input data-field="hero.mainDealSub" type="text"></label>
            <label>小活動標題 <input data-field="hero.miniDealTitle" type="text"></label>
          </div>
        </details>

        <details>
          <summary>服務優勢</summary>
          <div id="services-editor"></div>
        </details>

        <details>
          <summary>活動區</summary>
          <label>小標 <input data-field="campaign.eyebrow" type="text"></label>
          <label>標題 <input data-field="campaign.title" type="text"></label>
          <label>活動文案 <textarea data-field="campaign.copy" rows="4"></textarea></label>
          <div class="form-grid">
            <label>按鈕文字 <input data-field="campaign.linkText" type="text"></label>
            <label>按鈕連結 <input data-field="campaign.linkUrl" type="text"></label>
          </div>
        </details>

        <details open>
          <summary>自訂圖片 / 文字區塊</summary>
          <div class="custom-block-toolbar">
            <button class="secondary-link" id="add-text-block" type="button">新增文字</button>
            <button class="secondary-link" id="add-image-block" type="button">新增圖片</button>
            <button class="secondary-link" id="add-text-image-block" type="button">新增圖文</button>
          </div>
          <p class="editor-help">可自由新增首頁內容區塊，支援上傳圖片、填寫文字、設定按鈕連結與圖文排列。</p>
          <div class="custom-block-editor-list" id="custom-blocks-editor"></div>
        </details>

        <details>
          <summary>分類區</summary>
          <label>區塊小標 <input data-field="categorySection.eyebrow" type="text"></label>
          <label>區塊標題 <input data-field="categorySection.title" type="text"></label>
          <label>區塊說明 <textarea data-field="categorySection.copy" rows="3"></textarea></label>
          <div id="categories-editor"></div>
        </details>

        <details>
          <summary>會員區</summary>
          <label>小標 <input data-field="member.eyebrow" type="text"></label>
          <label>標題 <input data-field="member.title" type="text"></label>
          <label>說明 <textarea data-field="member.copy" rows="4"></textarea></label>
          <div id="member-stats-editor"></div>
        </details>

        <details>
          <summary>頁尾</summary>
          <label>頁尾標題 <input data-field="footer.title" type="text"></label>
          <label>頁尾文案 <textarea data-field="footer.copy" rows="3"></textarea></label>
          <div id="footer-links-editor"></div>
        </details>
      </form>

      <div class="editor-sticky-actions">
        <button class="primary-link" id="save-content-bottom" type="button">儲存前台內容</button>
        <button class="secondary-link" id="reset-content" type="button">還原預設內容</button>
      </div>
    </section>

    <section class="visual-preview-panel" aria-labelledby="preview-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Preview</p>
          <h2 id="preview-title">即時預覽</h2>
        </div>
        <p id="save-status">尚未儲存</p>
      </div>
      <div class="preview-shell" id="visual-preview"></div>
    </section>
  </main>

  <script src="site-content.js"></script>
  <script src="visual-editor.js"></script>
</body>
</html>
